<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GhostOS Academy — Full</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <style>
        :root {
            --bg: #050508; --bg-card: #0d0d14; --p: #8A77FF; --teal: #00f2ff;
            --gold: #ffcc00; --text: #e0e0e6; --error: #ff3366; --border: rgba(138, 119, 255, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: var(--bg-card); padding: 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .currency { color: var(--gold); font-weight: bold; font-size: 14px; }
        .prog-container { flex: 1; margin: 0 15px; height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
        #prog-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--p), var(--teal)); transition: 0.5s; }

        nav { display: flex; background: var(--bg-card); border-bottom: 1px solid var(--border); overflow-x: auto; }
        .nav-btn { flex: 1; padding: 15px; border: none; background: none; color: #555; font-size: 11px; font-weight: bold; cursor: pointer; }
        .nav-btn.active { color: var(--p); border-bottom: 2px solid var(--p); }

        .viewport { flex: 1; position: relative; overflow: hidden; }
        .view { position: absolute; inset: 0; display: none; flex-direction: column; padding: 15px; overflow-y: auto; }
        .view.active { display: flex; }

        .card { background: var(--bg-card); border-radius: 12px; padding: 18px; border: 1px solid var(--border); margin-bottom: 15px; }
        h1 { color: var(--p); font-size: 18px; margin-bottom: 8px; }
        .expl { font-size: 14px; line-height: 1.5; color: #bbb; margin-bottom: 10px; }
        .mission { background: rgba(0,242,255,0.05); border: 1px dashed var(--teal); padding: 10px; border-radius: 8px; font-size: 13px; color: var(--teal); }

        #editor { flex: 1; background: #000; color: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 15px; font-family: monospace; font-size: 16px; outline: none; margin-bottom: 10px; }
        .btn-run { background: var(--p); color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #console { height: 150px; background: #000; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 13px; overflow-y: auto; border: 1px solid var(--border); margin-top: 10px; }
        #hint-box { background: rgba(255,51,102,0.1); color: var(--error); padding: 8px; border-radius: 6px; font-size: 12px; display: none; margin-bottom: 5px; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 10px; color: var(--p);">GHOST_ACADEMY</div>
    <div class="prog-container"><div id="prog-bar"></div></div>
    <div class="currency">💰 <span id="balance">0</span></div>
</header>

<nav>
    <button class="nav-btn active" id="tab-guide" onclick="showTab('guide')">COURS</button>
    <button class="nav-btn" id="tab-lab" onclick="showTab('lab')">LABO</button>
    <button class="nav-btn" id="tab-codex" onclick="showTab('codex')">CODEX</button>
    <button class="nav-btn" id="tab-shop" onclick="showTab('shop')">SHOP</button>
</nav>

<div class="viewport">
    <div id="view-guide" class="view active">
        <div id="lesson-content"></div>
    </div>

    <div id="view-lab" class="view">
        <div id="hint-box"></div>
        <textarea id="editor" spellcheck="false" placeholder="# Tape ton code ici..."></textarea>
        <button class="btn-run" onclick="checkCode()">VÉRIFIER LE CODE</button>
        <div id="console"></div>
    </div>

    <div id="view-codex" class="view">
        <h1>CODEX : RÉCAPITULATIF</h1>
        <div id="codex-list" style="margin-top:15px;"></div>
    </div>

    <div id="view-shop" class="view">
        <h1>BOUTIQUE</h1>
        <p>Arrivera bientôt avec plus de crédits !</p>
    </div>
</div>

<script>
    // --- AUDIO SIMPLE ---
    const sound = (f) => {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        let g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = f; g.gain.value = 0.1;
        osc.start(); setTimeout(() => osc.stop(), 200);
    };

    // --- MODULES (1 à 100 possibles ici) ---
    const MODULES = [
        { id:0, title:"L'affichage", text:"Pour afficher un texte, on utilise <b>print()</b>. Le texte doit être entre guillemets.", mission:"Affiche : Ghost", target:"Ghost", symb:"print()", def:"Afficher du texte" },
        { id:1, title:"Les Variables", text:"Une variable est un nom qui stocke une valeur. On utilise le signe <b>=</b> pour donner une valeur.", mission:"Crée la variable age = 20 et affiche age", target:"20", symb:"=", def:"Donner une valeur" },
        { id:2, title:"Calcul Simple", text:"On peut faire des maths directement. Python connaît +, -, * et /.", mission:"Affiche le résultat de 10 + 5", target:"15", symb:"+", def:"Additionner" },
        { id:3, title:"Le Texte dynamique", text:"Pour coller du texte et un nombre, on utilise <b>str()</b> autour du nombre.", mission:"Affiche : Ghost + str(1)", target:"Ghost1", symb:"str()", def:"Transformer en texte" },
        { id:4, title:"Les Listes", text:"Pour stocker plusieurs trucs, on utilise des crochets <b>[ ]</b>.", mission:"Crée L = [1, 2] et affiche L", target:"[1, 2]", symb:"[ ]", def:"Stocker plusieurs valeurs" }
    ];

    let state = {
        idx: parseInt(localStorage.getItem('ghost_idx')) || 0,
        credits: parseInt(localStorage.getItem('ghost_credits')) || 0,
        fails: 0
    };

    let pyodide;
    async function load() {
        pyodide = await loadPyodide();
        render();
    }
    load();

    function render() {
        const m = MODULES[state.idx];
        if(!m) {
            document.getElementById('lesson-content').innerHTML = "<h1>Bravo !</h1><p>Tu as fini les modules disponibles.</p>";
            return;
        }
        document.getElementById('lesson-content').innerHTML = `
            <div class="card">
                <h1>${m.title}</h1>
                <p class="expl">${m.text}</p>
                <div class="mission"><b>MISSION :</b> ${m.mission}</div>
                <button class="btn-run" style="width:100%; margin-top:15px; background:var(--teal);" onclick="showTab('lab')">C'EST PARTI</button>
            </div>
        `;
        document.getElementById('balance').innerText = state.credits;
        document.getElementById('prog-bar').style.width = (state.idx / MODULES.length * 100) + "%";
        updateCodex();
    }

    async function checkCode() {
        const code = document.getElementById('editor').value;
        const cons = document.getElementById('console');
        const hint = document.getElementById('hint-box');
        
        try {
            pyodide.runPython(`import sys, io; sys.stdout = io.StringIO()`);
            await pyodide.runPythonAsync(code);
            const res = pyodide.runPython("sys.stdout.getvalue()").trim();
            cons.innerHTML = `<div style="color:white">> ${res}</div>`;

            if(res === MODULES[state.idx].target) {
                sound(800);
                state.credits += 50; state.idx++; state.fails = 0;
                localStorage.setItem('ghost_idx', state.idx);
                localStorage.setItem('ghost_credits', state.credits);
                hint.style.display = 'none';
                cons.innerHTML += `<div style="color:var(--teal); margin-top:5px;">RÉUSSI ! +50 GC</div>`;
                setTimeout(() => { showTab('guide'); render(); }, 1200);
            } else {
                handleFail();
            }
        } catch(e) {
            handleFail(e.message);
        }
    }

    function handleFail(err) {
        sound(200);
        state.fails++;
        const hint = document.getElementById('hint-box');
        hint.style.display = 'block';
        if(state.fails < 3) hint.innerText = "Erreur détectée. Regarde bien la mission.";
        else if(state.fails < 5) hint.innerText = "INDICE : " + MODULES[state.idx].symb + " est nécessaire.";
        else hint.innerText = "SOLUTION : Tape exactement -> " + MODULES[state.idx].target;
    }

    function showTab(t) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('view-' + t).classList.add('active');
        document.getElementById('tab-' + t).classList.add('active');
    }

    function updateCodex() {
        const list = document.getElementById('codex-list');
        list.innerHTML = "";
        for(let i=0; i<state.idx; i++) {
            list.innerHTML += `<div class="card" style="padding:10px; margin-bottom:5px;">
                <b style="color:var(--p)">${MODULES[i].symb}</b> : ${MODULES[i].def}
            </div>`;
        }
    }
</script>
</body>
</html>
