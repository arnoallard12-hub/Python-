<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GhostOS Academy — Python Masterclass</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <style>
        :root {
            --bg: #0d0d14;
            --bg-card: #16161f;
            --p: #7F77DD; /* Violet GhostOS */
            --p-glow: rgba(127, 119, 221, 0.4);
            --text: #e6e3f0;
            --text-muted: #8e8ba0;
            --teal: #1D9E75; /* Teal GhostOS */
            --error: #e05555;
            --border: rgba(255,255,255,0.08);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRE DE PROGRESSION GÉNÉRALE */
        .header-academy {
            background: var(--bg-card);
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
        }
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }
        #main-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--p), var(--teal));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--p-glow);
        }

        /* NAVIGATION TABS */
        .nav-tabs {
            display: flex;
            background: var(--bg-card);
            padding: 5px;
            gap: 5px;
        }
        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: var(--radius);
            transition: 0.3s;
        }
        .tab-btn.active {
            color: var(--text);
            background: var(--p-glow);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        /* CONTENU */
        .content-area { flex: 1; position: relative; overflow: hidden; }
        .view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .view.active { display: flex; }

        /* MODULES DE L'ACADÉMIE */
        .step-card {
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { color: var(--p); font-size: 20px; margin-bottom: 15px; }
        p { line-height: 1.6; color: var(--text-muted); margin-bottom: 15px; font-size: 15px; }
        b { color: var(--text); }

        .analogy-box {
            background: rgba(29, 158, 117, 0.1);
            border-left: 4px solid var(--teal);
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }

        .code-example {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            margin: 15px 0;
            border: 1px solid var(--border);
            position: relative;
        }

        .btn-magic {
            background: var(--p);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-next {
            background: var(--teal);
            color: white;
            border: none;
            padding: 15px;
            border-radius: var(--radius);
            font-weight: bold;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(29, 158, 117, 0.3);
        }

        /* ÉDITEUR & CONSOLE */
        #editor {
            flex: 1; background: #08080c; color: #a9b7c6;
            border: 1px solid var(--border); border-radius: 8px;
            padding: 15px; font-family: 'Consolas', monospace; font-size: 15px;
            resize: none; outline: none; margin-bottom: 10px;
        }
        .controls { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn-run { flex: 2; background: var(--teal); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; }
        #console {
            height: 140px; background: #000; border-radius: 8px;
            padding: 10px; font-family: monospace; font-size: 12px;
            overflow-y: auto; border: 1px solid var(--border);
        }
        .log-success { color: var(--teal); }
        .log-error { color: var(--error); }

        /* LOADER */
        .loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg); display: flex; align-items:center; justify-content:center;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <div style="text-align:center;">
        <h2 style="color:var(--p); letter-spacing: 2px;">GHOSTOS ACADEMY</h2>
        <p>Connexion neuronale...</p>
    </div>
</div>

<div class="header-academy">
    <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold;">
        <span>PROGRESSION</span>
        <span id="progress-text">0%</span>
    </div>
    <div class="progress-container">
        <div id="main-progress"></div>
    </div>
</div>

<div class="nav-tabs">
    <button id="btn-tab-guide" class="tab-btn active" onclick="switchTab('guide')">Apprendre</button>
    <button id="btn-tab-code" class="tab-btn" onclick="switchTab('code')">Pratiquer</button>
</div>

<div class="content-area">
    <div id="view-guide" class="view active">
        <div id="module-content" class="step-card">
            </div>
        <button id="next-btn" class="btn-next" onclick="nextStep()">ÉTAPE SUIVANTE</button>
    </div>

    <div id="view-code" class="view">
        <textarea id="editor" spellcheck="false" placeholder="# Écris ton code Python ici..."></textarea>
        <div class="controls">
            <button class="btn-run" onclick="runPython()">▶ EXÉCUTER</button>
            <button style="background:var(--bg-card); color:white; border:1px solid var(--border); padding:10px; border-radius:8px;" onclick="clearConsole()">X</button>
        </div>
        <div id="console"></div>
    </div>
</div>

<script>
    // --- MOTEUR DE CONTENU (MODULE 1) ---
    const moduleSteps = [
        {
            title: "L'Origine du Flux",
            content: `<h1>La Philosophie Python</h1>
                      <p>Dans GhostOS, on ne code pas au hasard. Python a été créé pour être <b>lisible</b>. Si un code est moche, il est probablement mauvais.</p>
                      <div class="analogy-box">
                        <b>Analogie :</b> Imagine que Python est un traducteur universel entre ton cerveau et la machine. Moins il y a de mots compliqués, plus le flux est rapide.
                      </div>
                      <p>Teste ton premier message vers le système :</p>`,
            code: "print('Système GhostOS activé')",
            target: "Système GhostOS activé"
        },
        {
            title: "L'Entrepôt de Données",
            content: `<h1>La Mémoire (Stack vs Heap)</h1>
                      <p>Ton téléphone a deux types de mémoires. La <b>Stack</b> (une pile d'assiettes) pour les choses rapides, et la <b>Heap</b> (un grand entrepôt) pour les gros objets.</p>
                      <div class="analogy-box">
                        <b>Analogie :</b> Créer une variable, c'est coller une <b>étiquette</b> sur une boîte dans l'entrepôt.
                      </div>
                      <p>Crée ta première variable :</p>`,
            code: "version = 1.0\nprint(version)",
            target: "1.0"
        },
        {
            title: "Les Types de Réalité",
            content: `<h1>Les Types de Données</h1>
                      <p>Python doit savoir ce qu'il y a dans la boîte :</p>
                      <p>1. <b>int</b> : Nombres entiers (ex: 10)<br>2. <b>str</b> : Texte (ex: "Ghost")<br>3. <b>float</b> : Nombres à virgule (ex: 1.5)</p>
                      <div class="analogy-box"><b>Challenge :</b> Essaie de changer le type d'une donnée pour voir ce qui se passe.</div>`,
            code: "nom = 'Ghost'\nprint(type(nom))",
            target: "<class 'str'>"
        }
    ];

    let currentStep = localStorage.getItem('ghostos_progress') ? parseInt(localStorage.getItem('ghostos_progress')) : 0;
    let pyodide;

    async function init() {
        pyodide = await loadPyodide();
        document.getElementById('loader').style.display = 'none';
        renderStep();
    }
    init();

    function renderStep() {
        const step = moduleSteps[currentStep];
        if(!step) {
            document.getElementById('module-content').innerHTML = "<h1>Félicitations !</h1><p>Tu as terminé le Module 1. Prêt pour le Module 2 ?</p>";
            document.getElementById('next-btn').style.display = 'none';
            return;
        }
        
        document.getElementById('module-content').innerHTML = `
            <span style="color:var(--teal); font-size:12px; font-weight:bold;">${step.title}</span>
            ${step.content}
            <div class="code-example">${step.code.replace(/\n/g, '<br>')}</div>
            <button class="btn-magic" onclick="magicCopy('${step.code.replace(/'/g, "\\'")}')">⚡ ENVOYER À L'ÉDITEUR</button>
        `;
        
        const progress = ((currentStep) / moduleSteps.length) * 100;
        document.getElementById('main-progress').style.width = progress + '%';
        document.getElementById('progress-text').innerText = Math.round(progress) + '%';
    }

    function nextStep() {
        if(currentStep < moduleSteps.length - 1) {
            currentStep++;
            localStorage.setItem('ghostos_progress', currentStep);
            renderStep();
            switchTab('guide');
        } else {
            alert("Module 1 terminé !");
        }
    }

    function magicCopy(code) {
        document.getElementById('editor').value = code;
        switchTab('code');
    }

    function switchTab(tab) {
        document.getElementById('view-guide').classList.remove('active');
        document.getElementById('view-code').classList.remove('active');
        document.getElementById('btn-tab-guide').classList.remove('active');
        document.getElementById('btn-tab-code').classList.remove('active');

        if(tab === 'guide') {
            document.getElementById('view-guide').classList.add('active');
            document.getElementById('btn-tab-guide').classList.add('active');
        } else {
            document.getElementById('view-code').classList.add('active');
            document.getElementById('btn-tab-code').classList.add('active');
        }
    }

    function clearConsole() { document.getElementById('console').innerHTML = ''; }

    async function runPython() {
        const code = document.getElementById('editor').value;
        const consoleEl = document.getElementById('console');
        clearConsole();

        try {
            pyodide.runPython(`
                import sys
                import io
                sys.stdout = io.StringIO()
            `);
            await pyodide.runPythonAsync(code);
            const output = pyodide.runPython("sys.stdout.getvalue()");
            const line = document.createElement('div');
            line.className = 'log-success';
            line.innerText = output || "Code exécuté sans erreur.";
            consoleEl.appendChild(line);
        } catch (err) {
            const line = document.createElement('div');
            line.className = 'log-error';
            line.innerText = err;
            consoleEl.appendChild(line);
        }
    }
</script>

</body>
</html>
