<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GhostOS Academy — Ultra</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <style>
        :root {
            --bg: #050508;
            --bg-card: #0d0d14;
            --p: #7F77DD; /* Violet GhostOS */
            --teal: #1D9E75;
            --gold: #FFD700;
            --text: #e6e3f0;
            --error: #ff4d4d;
            --border: rgba(127, 119, 221, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER & PROGRESSION */
        .header { background: var(--bg-card); padding: 15px; border-bottom: 2px solid var(--border); }
        .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
        .progress-bar { height: 8px; background: #1a1a2e; border-radius: 4px; overflow: hidden; }
        #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--p), var(--teal)); transition: 0.8s cubic-bezier(0.22, 1, 0.36, 1); }

        /* NAVIGATION */
        .nav { display: flex; background: var(--bg-card); border-bottom: 1px solid var(--border); }
        .nav-btn { flex: 1; padding: 15px; border: none; background: none; color: #555; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .nav-btn.active { color: var(--p); border-bottom: 3px solid var(--p); background: rgba(127, 119, 221, 0.05); }

        /* VIEWS */
        .content { flex: 1; position: relative; }
        .view { position: absolute; inset: 0; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
        .view.active { display: flex; }

        /* CARDS */
        .card { background: var(--bg-card); border-radius: 15px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        h1 { color: var(--p); font-size: 22px; margin-bottom: 10px; }
        .scientific-note { background: rgba(29, 158, 117, 0.05); border-left: 4px solid var(--teal); padding: 15px; margin: 15px 0; font-size: 14px; color: #a9b7c6; }
        
        /* EDITOR */
        #editor { flex: 1; background: #000; color: #d4d4d4; padding: 15px; border: 1px solid var(--border); border-radius: 10px; font-family: monospace; font-size: 16px; margin-bottom: 10px; outline: none; }
        .run-area { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn-run { flex: 3; padding: 15px; background: var(--p); border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 16px; }
        
        /* CONSOLE */
        #console { height: 180px; background: #000; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-family: monospace; font-size: 14px; overflow-y: auto; line-height: 1.5; }
        .msg-err { color: var(--error); padding: 5px 0; }
        .msg-success { color: var(--teal); font-weight: bold; }

        /* CODEX */
        .codex-item { padding: 10px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
        .locked { opacity: 0.3; filter: grayscale(1); }

        /* LOADER */
        .loader-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 2000; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--p); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader" class="loader-screen">
    <div class="spinner"></div>
    <h2 style="color:var(--p)">GHOSTOS ACADEMY</h2>
    <p style="font-size: 12px; margin-top: 10px;">Chargement des modules cognitifs...</p>
</div>

<div class="header">
    <div class="stats">
        <span>MODULE <span id="mod-num">1</span></span>
        <span id="streak">🔥 0 JOURS</span>
        <span id="prog-val">0%</span>
    </div>
    <div class="progress-bar">
        <div id="progress-fill"></div>
    </div>
</div>

<div class="nav">
    <button id="tab-guide" class="nav-btn active" onclick="switchTab('guide')">GUIDE</button>
    <button id="tab-code" class="nav-btn" onclick="switchTab('code')">LABO</button>
    <button id="tab-codex" class="nav-btn" onclick="switchTab('codex')">CODEX</button>
</div>

<div class="content">
    <div id="view-guide" class="view active">
        <div id="lesson-box" class="card">
            </div>
    </div>

    <div id="view-code" class="view">
        <div style="font-size: 12px; color: var(--p); margin-bottom: 5px;">OBJECTIF : <span id="objective-text">...</span></div>
        <textarea id="editor" spellcheck="false" placeholder="# Écris ton code ici..."></textarea>
        <div class="run-area">
            <button class="btn-run" onclick="executePython()">EXÉCUTER LE CODE</button>
        </div>
        <div id="console"></div>
    </div>

    <div id="view-codex" class="view">
        <h1>SYNTHÈSE TACTILE</h1>
        <div id="codex-list"></div>
    </div>
</div>

<script>
    // --- BASE DE DONNÉES DES MODULES (EXTENSIBLE À L'INFINI) ---
    const ACADEMY_DATA = [
        {
            id: 1,
            title: "Le Signal Originel",
            depth: "En informatique, tout n'est que flux. La fonction <b>print()</b> n'est pas juste du texte, c'est l'instruction qui demande au noyau d'envoyer des données vers la sortie standard (STDOUT). C'est le premier lien entre ton code et la réalité physique de l'écran.",
            scientific: "Neuro-tip : Écrire physiquement chaque lettre active la mémoire motrice, ce qui rend l'apprentissage 3x plus rapide qu'un copier-coller.",
            objective: "Affiche exactement le texte : Bonjour GhostOS",
            validation: "Bonjour GhostOS",
            codex: "print() : La fonction de sortie universelle."
        },
        {
            id: 2,
            title: "L'Étiquetage Moléculaire",
            depth: "Les variables sont des adresses mémoires. En Python, une variable n'est pas la boîte elle-même, mais une étiquette qui pointe vers un objet dans la RAM (Tas/Heap). C'est ce qu'on appelle le typage dynamique.",
            scientific: "Structure : [Nom de Variable] = [Valeur]. Python alloue automatiquement l'espace nécessaire.",
            objective: "Crée une variable nommée 'x' égale à 50 et affiche x",
            validation: "50",
            codex: "Variables : Étiquettes pointant vers des adresses mémoire."
        },
        {
            id: 3,
            title: "La Logique Binaire",
            depth: "Le cerveau de GhostOS repose sur des décisions. Une condition IF vérifie si un courant passe (True) ou non (False). C'est l'algèbre de Boole appliquée au silicium.",
            scientific: "Note : L'indentation (l'espace au début) est OBLIGATOIRE en Python. C'est ce qui définit le bloc de code.",
            objective: "Crée une variable 'v' = 10. Si v > 5, affiche: OK",
            validation: "OK",
            codex: "IF : Structure de décision logique basée sur le booléen."
        }
        // Rajouter les 100 modules ici...
    ];

    let currentIdx = localStorage.getItem('ghostIdx') ? parseInt(localStorage.getItem('ghostIdx')) : 0;
    let pyodide;

    async function init() {
        pyodide = await loadPyodide();
        document.getElementById('loader').style.display = 'none';
        loadLesson();
        updateCodex();
    }
    init();

    function loadLesson() {
        const data = ACADEMY_DATA[currentIdx];
        if(!data) return;

        document.getElementById('lesson-box').innerHTML = `
            <h1>${data.title}</h1>
            <p>${data.depth}</p>
            <div class="scientific-note">${data.scientific}</div>
            <div style="background: rgba(127,119,221,0.1); padding:10px; border-radius:8px; border:1px dashed var(--p);">
                <b>MISSION :</b> ${data.objective}
            </div>
            <button class="btn-run" style="margin-top:20px; background:var(--teal);" onclick="switchTab('code')">ALLER AU LABO</button>
        `;
        document.getElementById('objective-text').innerText = data.objective;
        updateProgress();
    }

    function updateProgress() {
        const p = (currentIdx / ACADEMY_DATA.length) * 100;
        document.getElementById('progress-fill').style.width = p + '%';
        document.getElementById('prog-val').innerText = Math.round(p) + '%';
    }

    function switchTab(t) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('view-' + t).classList.add('active');
        document.getElementById('tab-' + t).classList.add('active');
    }

    async function executePython() {
        const code = document.getElementById('editor').value;
        const cons = document.getElementById('console');
        cons.innerHTML = "<i>Exécution...</i>";

        try {
            pyodide.runPython(`
                import sys, io
                sys.stdout = io.StringIO()
            `);
            await pyodide.runPythonAsync(code);
            const output = pyodide.runPython("sys.stdout.getvalue()").trim();
            
            cons.innerHTML = `<div class="msg-success">> ${output || "Exécuté (sans sortie)"}</div>`;

            // VALIDATION AUTO
            if(output === ACADEMY_DATA[currentIdx].validation) {
                cons.innerHTML += `<div class="msg-success" style="margin-top:10px;">✨ ANALYSE NEURONALE RÉUSSIE !</div>`;
                setTimeout(() => {
                    alert("BRAVO ! Étape validée.");
                    currentIdx++;
                    localStorage.setItem('ghostIdx', currentIdx);
                    loadLesson();
                    updateCodex();
                    switchTab('guide');
                }, 1000);
            }
        } catch (err) {
            let msg = err.message;
            if(msg.includes("NameError")) msg = "❌ Erreur : Tu utilises un mot ou une variable qui n'existe pas.";
            if(msg.includes("IndentationError")) msg = "❌ Erreur : Problème d'espacement (Indentation).";
            if(msg.includes("SyntaxError")) msg = "❌ Erreur : Il y a une faute de frappe dans ta syntaxe.";
            cons.innerHTML = `<div class="msg-err">${msg}</div>`;
        }
    }

    function updateCodex() {
        const list = document.getElementById('codex-list');
        list.innerHTML = "";
        ACADEMY_DATA.forEach((m, i) => {
            const isLocked = i > currentIdx;
            list.innerHTML += `
                <div class="card codex-item ${isLocked ? 'locked' : ''}">
                    <div style="color:var(--teal)">${isLocked ? '🔒 Bloqué' : '✅ Acquis'}</div>
                    <div style="font-weight:bold; margin-top:5px;">${m.title}</div>
                    <div style="font-size:12px; color:var(--text-muted);">${isLocked ? 'Continue pour débloquer cette archive' : m.codex}</div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
